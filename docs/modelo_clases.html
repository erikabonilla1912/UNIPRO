<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modelo de Clases — UNIPRO</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9f9f7;
      color: #1a1a18;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; color: #1a1a18; }
    p { font-size: 14px; color: #717182; margin: 0 0 24px; }
    .card { background: #fff; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); padding: 24px; }
    svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; font-weight: 400; }
    .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
    .legend-box { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px; font-size: 13px; color: #444; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  </style>
</head>
<body>
  <h1>Modelo de Clases — UNIPRO</h1>
  <p>Clases principales del sistema: modelos del backend y servicios del frontend con atributos, métodos y relaciones.</p>
  <div class="card">
    <svg width="100%" viewBox="0 0 680 720">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- USER CLASS -->
      <g class="c-blue">
        <rect x="40" y="40" width="200" height="220" rx="8" stroke-width="0.5"/>
        <rect x="40" y="40" width="200" height="34" rx="8" stroke-width="0.5"/>
        <text class="th" x="140" y="62" text-anchor="middle" dominant-baseline="central" fill="#0C447C">User</text>
      </g>
      <line x1="40" y1="74" x2="240" y2="74" stroke="#185FA5" stroke-width="0.5"/>
      <text class="ts" x="52" y="92" fill="#0C447C">- _id: ObjectId</text>
      <text class="ts" x="52" y="108" fill="#0C447C">- name: String</text>
      <text class="ts" x="52" y="124" fill="#0C447C">- email: String</text>
      <text class="ts" x="52" y="140" fill="#0C447C">- password: String</text>
      <text class="ts" x="52" y="156" fill="#0C447C">- university: String</text>
      <text class="ts" x="52" y="172" fill="#0C447C">- role: user | admin</text>
      <text class="ts" x="52" y="188" fill="#0C447C">- active: Boolean</text>
      <text class="ts" x="52" y="204" fill="#0C447C">- createdAt: Date</text>
      <line x1="40" y1="214" x2="240" y2="214" stroke="#185FA5" stroke-width="0.5"/>
      <text class="ts" x="52" y="230" fill="#185FA5">+ comparePassword()</text>
      <text class="ts" x="52" y="246" fill="#185FA5">+ generateToken()</text>

      <!-- PROJECT CLASS -->
      <g class="c-purple">
        <rect x="280" y="40" width="220" height="280" rx="8" stroke-width="0.5"/>
        <rect x="280" y="40" width="220" height="34" rx="8" stroke-width="0.5"/>
        <text class="th" x="390" y="62" text-anchor="middle" dominant-baseline="central" fill="#3C3489">Project</text>
      </g>
      <line x1="280" y1="74" x2="500" y2="74" stroke="#534AB7" stroke-width="0.5"/>
      <text class="ts" x="292" y="92" fill="#3C3489">- _id: ObjectId</text>
      <text class="ts" x="292" y="108" fill="#3C3489">- title: String</text>
      <text class="ts" x="292" y="124" fill="#3C3489">- description: String</text>
      <text class="ts" x="292" y="140" fill="#3C3489">- category: String</text>
      <text class="ts" x="292" y="156" fill="#3C3489">- tags: String[]</text>
      <text class="ts" x="292" y="172" fill="#3C3489">- university: String</text>
      <text class="ts" x="292" y="188" fill="#3C3489">- author: ObjectId → User</text>
      <text class="ts" x="292" y="204" fill="#3C3489">- image: String</text>
      <text class="ts" x="292" y="220" fill="#3C3489">- views: Number</text>
      <text class="ts" x="292" y="236" fill="#3C3489">- downloads: Number</text>
      <text class="ts" x="292" y="252" fill="#3C3489">- status: pending|approved|rejected</text>
      <text class="ts" x="292" y="268" fill="#3C3489">- createdAt: Date</text>
      <line x1="280" y1="278" x2="500" y2="278" stroke="#534AB7" stroke-width="0.5"/>
      <text class="ts" x="292" y="294" fill="#534AB7">+ getAll(filters)</text>
      <text class="ts" x="292" y="310" fill="#534AB7">+ getById(id)</text>

      <!-- RECLAMO CLASS -->
      <g class="c-coral">
        <rect x="540" y="40" width="120" height="230" rx="8" stroke-width="0.5"/>
        <rect x="540" y="40" width="120" height="34" rx="8" stroke-width="0.5"/>
        <text class="th" x="600" y="62" text-anchor="middle" dominant-baseline="central" fill="#712B13">Reclamo</text>
      </g>
      <line x1="540" y1="74" x2="660" y2="74" stroke="#993C1D" stroke-width="0.5"/>
      <text class="ts" x="552" y="92" fill="#712B13">- _id: ObjectId</text>
      <text class="ts" x="552" y="108" fill="#712B13">- user: ObjectId</text>
      <text class="ts" x="552" y="124" fill="#712B13">- subject: String</text>
      <text class="ts" x="552" y="140" fill="#712B13">- message: String</text>
      <text class="ts" x="552" y="156" fill="#712B13">- status: String</text>
      <text class="ts" x="552" y="172" fill="#712B13">- response: String</text>
      <text class="ts" x="552" y="188" fill="#712B13">- createdAt: Date</text>
      <line x1="540" y1="198" x2="660" y2="198" stroke="#993C1D" stroke-width="0.5"/>
      <text class="ts" x="552" y="214" fill="#993C1D">+ create()</text>
      <text class="ts" x="552" y="230" fill="#993C1D">+ getAll()</text>
      <text class="ts" x="552" y="246" fill="#993C1D">+ getMine()</text>

      <!-- AUTH SERVICE CLASS -->
      <g class="c-teal">
        <rect x="40" y="320" width="200" height="160" rx="8" stroke-width="0.5"/>
        <rect x="40" y="320" width="200" height="34" rx="8" stroke-width="0.5"/>
        <text class="th" x="140" y="342" text-anchor="middle" dominant-baseline="central" fill="#085041">AuthService</text>
      </g>
      <line x1="40" y1="354" x2="240" y2="354" stroke="#0F6E56" stroke-width="0.5"/>
      <text class="ts" x="52" y="372" fill="#085041">- API: string</text>
      <text class="ts" x="52" y="388" fill="#085041">- currentUser: signal</text>
      <line x1="40" y1="398" x2="240" y2="398" stroke="#0F6E56" stroke-width="0.5"/>
      <text class="ts" x="52" y="414" fill="#0F6E56">+ login(email, password)</text>
      <text class="ts" x="52" y="430" fill="#0F6E56">+ register(data)</text>
      <text class="ts" x="52" y="446" fill="#0F6E56">+ logout()</text>
      <text class="ts" x="52" y="462" fill="#0F6E56">+ isLoggedIn(): bool</text>

      <!-- PROJECT SERVICE CLASS -->
      <g class="c-teal">
        <rect x="280" y="370" width="220" height="180" rx="8" stroke-width="0.5"/>
        <rect x="280" y="370" width="220" height="34" rx="8" stroke-width="0.5"/>
        <text class="th" x="390" y="392" text-anchor="middle" dominant-baseline="central" fill="#085041">ProjectService</text>
      </g>
      <line x1="280" y1="404" x2="500" y2="404" stroke="#0F6E56" stroke-width="0.5"/>
      <text class="ts" x="292" y="422" fill="#085041">- API: string</text>
      <line x1="280" y1="432" x2="500" y2="432" stroke="#0F6E56" stroke-width="0.5"/>
      <text class="ts" x="292" y="450" fill="#0F6E56">+ getAll(filters)</text>
      <text class="ts" x="292" y="466" fill="#0F6E56">+ getById(id)</text>
      <text class="ts" x="292" y="482" fill="#0F6E56">+ create(formData)</text>
      <text class="ts" x="292" y="498" fill="#0F6E56">+ update(id, data)</text>
      <text class="ts" x="292" y="514" fill="#0F6E56">+ delete(id)</text>
      <text class="ts" x="292" y="530" fill="#0F6E56">+ search(query)</text>

      <!-- AUTH GUARD CLASS -->
      <g class="c-amber">
        <rect x="540" y="320" width="120" height="100" rx="8" stroke-width="0.5"/>
        <rect x="540" y="320" width="120" height="34" rx="8" stroke-width="0.5"/>
        <text class="th" x="600" y="342" text-anchor="middle" dominant-baseline="central" fill="#633806">AuthGuard</text>
      </g>
      <line x1="540" y1="354" x2="660" y2="354" stroke="#854F0B" stroke-width="0.5"/>
      <text class="ts" x="552" y="372" fill="#633806">- auth: AuthService</text>
      <line x1="540" y1="382" x2="660" y2="382" stroke="#854F0B" stroke-width="0.5"/>
      <text class="ts" x="552" y="398" fill="#854F0B">+ canActivate()</text>

      <!-- RELATIONSHIPS -->
      <line x1="240" y1="160" x2="280" y2="160" stroke="#888" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
      <text class="ts" x="258" y="153" text-anchor="middle" fill="#888">1</text>
      <text class="ts" x="275" y="153" text-anchor="middle" fill="#888">*</text>

      <line x1="140" y1="40" x2="140" y2="20" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
      <line x1="140" y1="20" x2="600" y2="20" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" fill="none"/>
      <line x1="600" y1="20" x2="600" y2="40" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)" fill="none"/>
      <text class="ts" x="370" y="16" text-anchor="middle" fill="#888">1 usuario — * reclamos</text>

      <line x1="140" y1="320" x2="140" y2="262" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)" fill="none"/>
      <text class="ts" x="155" y="295" fill="#888">usa</text>

      <line x1="390" y1="370" x2="390" y2="322" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)" fill="none"/>
      <text class="ts" x="405" y="350" fill="#888">usa</text>

      <line x1="540" y1="380" x2="242" y2="380" stroke="#888" stroke-width="0.8" stroke-dasharray="4 3" marker-end="url(#arrow)" fill="none"/>
      <text class="ts" x="395" y="374" text-anchor="middle" fill="#888">depende de</text>

      <!-- Legend -->
      <line x1="40" y1="640" x2="80" y2="640" stroke="#888" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
      <text class="ts" x="90" y="644" fill="#444">Asociacion / dependencia</text>
      <line x1="300" y1="640" x2="340" y2="640" stroke="#888" stroke-width="1" marker-end="url(#arrow)"/>
      <text class="ts" x="350" y="644" fill="#444">Referencia directa</text>

      <text class="ts" x="140" y="308" text-anchor="middle" fill="#888">Modelo (Backend)</text>
      <text class="ts" x="390" y="358" text-anchor="middle" fill="#888">Modelo (Backend)</text>
      <text class="ts" x="140" y="492" text-anchor="middle" fill="#888">Servicio (Frontend)</text>
      <text class="ts" x="390" y="558" text-anchor="middle" fill="#888">Servicio (Frontend)</text>
    </svg>
  </div>

  <div class="legend-box">
    <div class="legend-item"><div class="legend-dot" style="background:#E6F1FB;border:1px solid #185FA5"></div> User (modelo)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#EEEDFE;border:1px solid #534AB7"></div> Project (modelo)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FAECE7;border:1px solid #993C1D"></div> Reclamo (modelo)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#E1F5EE;border:1px solid #0F6E56"></div> Servicios (frontend)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FAEEDA;border:1px solid #854F0B"></div> Guards</div>
  </div>
</body>
</html>

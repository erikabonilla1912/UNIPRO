<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagrama de Componentes — UNIPRO</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9f9f7;
      color: #1a1a18;
    }
    h1 { font-size: 20px; font-weight: 500; margin-bottom: 4px; color: #1a1a18; }
    p { font-size: 14px; color: #717182; margin: 0 0 24px; }
    .card { background: #fff; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1); padding: 24px; }
    svg text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .th { font-size: 14px; font-weight: 500; fill: #1a1a18; }
    .ts { font-size: 12px; font-weight: 400; fill: #717182; }
    .c-blue rect { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue .th { fill: #0C447C; }
    .c-blue .ts { fill: #185FA5; }
    .c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .th { fill: #085041; }
    .c-teal .ts { fill: #0F6E56; }
    .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple .th { fill: #3C3489; }
    .c-purple .ts { fill: #534AB7; }
    .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber .th { fill: #633806; }
    .c-amber .ts { fill: #854F0B; }
    .c-coral rect { fill: #FAECE7; stroke: #993C1D; }
    .c-coral .th { fill: #712B13; }
    .c-coral .ts { fill: #993C1D; }
    .c-green rect { fill: #EAF3DE; stroke: #3B6D11; }
    .c-green .th { fill: #27500A; }
    .c-green .ts { fill: #3B6D11; }
    .legend-box { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px; font-size: 13px; color: #444; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
  </style>
</head>
<body>
  <h1>Diagrama de Componentes — UNIPRO</h1>
  <p>Arquitectura Monorepo: Angular 17 (frontend) + Node.js/Express (backend) + MongoDB Atlas</p>
  <div class="card">
    <svg width="100%" viewBox="0 0 680 500">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- FRONTEND container -->
      <g class="c-blue">
        <rect x="30" y="30" width="290" height="390" rx="16" stroke-width="0.5" fill-opacity="0.08"/>
        <text class="th" x="175" y="58" text-anchor="middle">Frontend</text>
        <text class="ts" x="175" y="74" text-anchor="middle">Angular 17 · localhost:4200</text>
      </g>
      <g class="c-blue">
        <rect x="50" y="90" width="250" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="175" y="108" text-anchor="middle" dominant-baseline="central">HeaderComponent</text>
        <text class="ts" x="175" y="124" text-anchor="middle" dominant-baseline="central">Nav + auth state</text>
      </g>
      <g class="c-blue">
        <rect x="50" y="148" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="109" y="166" text-anchor="middle" dominant-baseline="central">HomeComponent</text>
        <text class="ts" x="109" y="182" text-anchor="middle" dominant-baseline="central">Landing page</text>
      </g>
      <g class="c-blue">
        <rect x="182" y="148" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="241" y="166" text-anchor="middle" dominant-baseline="central">ProjectsComponent</text>
        <text class="ts" x="241" y="182" text-anchor="middle" dominant-baseline="central">Lista + filtros</text>
      </g>
      <g class="c-blue">
        <rect x="50" y="206" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="109" y="224" text-anchor="middle" dominant-baseline="central">LoginComponent</text>
        <text class="ts" x="109" y="240" text-anchor="middle" dominant-baseline="central">Formulario auth</text>
      </g>
      <g class="c-blue">
        <rect x="182" y="206" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="241" y="224" text-anchor="middle" dominant-baseline="central">PublishComponent</text>
        <text class="ts" x="241" y="240" text-anchor="middle" dominant-baseline="central">Crear proyecto</text>
      </g>
      <g class="c-blue">
        <rect x="50" y="264" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="109" y="282" text-anchor="middle" dominant-baseline="central">AdminComponent</text>
        <text class="ts" x="109" y="298" text-anchor="middle" dominant-baseline="central">Aprobar proyectos</text>
      </g>
      <g class="c-blue">
        <rect x="182" y="264" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="241" y="282" text-anchor="middle" dominant-baseline="central">ReclamosComponent</text>
        <text class="ts" x="241" y="298" text-anchor="middle" dominant-baseline="central">Quejas usuario</text>
      </g>
      <g class="c-teal">
        <rect x="50" y="326" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="109" y="344" text-anchor="middle" dominant-baseline="central">AuthService</text>
        <text class="ts" x="109" y="360" text-anchor="middle" dominant-baseline="central">JWT + signals</text>
      </g>
      <g class="c-teal">
        <rect x="182" y="326" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="241" y="344" text-anchor="middle" dominant-baseline="central">ProjectService</text>
        <text class="ts" x="241" y="360" text-anchor="middle" dominant-baseline="central">HTTP proyectos</text>
      </g>
      <g class="c-amber">
        <rect x="50" y="384" width="250" height="34" rx="8" stroke-width="0.5"/>
        <text class="th" x="175" y="401" text-anchor="middle" dominant-baseline="central">AuthGuard + AuthInterceptor</text>
        <text class="ts" x="175" y="413" text-anchor="middle" dominant-baseline="central">Protege rutas y agrega Bearer token</text>
      </g>

      <!-- BACKEND container -->
      <g class="c-purple">
        <rect x="360" y="30" width="290" height="310" rx="16" stroke-width="0.5" fill-opacity="0.08"/>
        <text class="th" x="505" y="58" text-anchor="middle">Backend</text>
        <text class="ts" x="505" y="74" text-anchor="middle">Node.js + Express · localhost:3000</text>
      </g>
      <g class="c-purple">
        <rect x="380" y="90" width="250" height="34" rx="8" stroke-width="0.5"/>
        <text class="th" x="505" y="107" text-anchor="middle" dominant-baseline="central">routes/index.js</text>
        <text class="ts" x="505" y="119" text-anchor="middle" dominant-baseline="central">API REST endpoints</text>
      </g>
      <g class="c-amber">
        <rect x="380" y="138" width="250" height="34" rx="8" stroke-width="0.5"/>
        <text class="th" x="505" y="155" text-anchor="middle" dominant-baseline="central">authMiddleware.js</text>
        <text class="ts" x="505" y="167" text-anchor="middle" dominant-baseline="central">protect + adminOnly</text>
      </g>
      <g class="c-purple">
        <rect x="380" y="186" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="439" y="204" text-anchor="middle" dominant-baseline="central">procesar_login</text>
        <text class="ts" x="439" y="220" text-anchor="middle" dominant-baseline="central">register / login</text>
      </g>
      <g class="c-purple">
        <rect x="512" y="186" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="571" y="204" text-anchor="middle" dominant-baseline="central">procesar_proyecto</text>
        <text class="ts" x="571" y="220" text-anchor="middle" dominant-baseline="central">CRUD proyectos</text>
      </g>
      <g class="c-purple">
        <rect x="380" y="244" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="439" y="262" text-anchor="middle" dominant-baseline="central">procesar_reclamo</text>
        <text class="ts" x="439" y="278" text-anchor="middle" dominant-baseline="central">CRUD reclamos</text>
      </g>
      <g class="c-purple">
        <rect x="512" y="244" width="118" height="44" rx="8" stroke-width="0.5"/>
        <text class="th" x="571" y="262" text-anchor="middle" dominant-baseline="central">procesar_busqueda</text>
        <text class="ts" x="571" y="278" text-anchor="middle" dominant-baseline="central">Busqueda texto</text>
      </g>

      <!-- Models -->
      <g class="c-coral">
        <rect x="380" y="355" width="80" height="54" rx="8" stroke-width="0.5"/>
        <text class="th" x="420" y="374" text-anchor="middle" dominant-baseline="central">userModel</text>
        <text class="ts" x="420" y="390" text-anchor="middle" dominant-baseline="central">Usuario</text>
      </g>
      <g class="c-coral">
        <rect x="475" y="355" width="80" height="54" rx="8" stroke-width="0.5"/>
        <text class="th" x="515" y="374" text-anchor="middle" dominant-baseline="central">proyectoModel</text>
        <text class="ts" x="515" y="390" text-anchor="middle" dominant-baseline="central">Proyecto</text>
      </g>
      <g class="c-coral">
        <rect x="570" y="355" width="80" height="54" rx="8" stroke-width="0.5"/>
        <text class="th" x="610" y="374" text-anchor="middle" dominant-baseline="central">reclamoModel</text>
        <text class="ts" x="610" y="390" text-anchor="middle" dominant-baseline="central">Reclamo</text>
      </g>

      <!-- MongoDB -->
      <g class="c-green">
        <rect x="380" y="430" width="250" height="44" rx="12" stroke-width="0.5"/>
        <text class="th" x="505" y="448" text-anchor="middle" dominant-baseline="central">MongoDB Atlas</text>
        <text class="ts" x="505" y="464" text-anchor="middle" dominant-baseline="central">users · projects · reclamos</text>
      </g>

      <!-- Arrows -->
      <line x1="322" y1="220" x2="358" y2="220" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>
      <text class="ts" x="340" y="213" text-anchor="middle">HTTP /api</text>
      <line x1="505" y1="410" x2="505" y2="428" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)" fill="none"/>
      <text class="ts" x="535" y="423" text-anchor="start">Mongoose</text>
    </svg>
  </div>

  <div class="legend-box">
    <div class="legend-item"><div class="legend-dot" style="background:#E6F1FB;border:1px solid #185FA5"></div> Componentes Angular</div>
    <div class="legend-item"><div class="legend-dot" style="background:#E1F5EE;border:1px solid #0F6E56"></div> Servicios Angular</div>
    <div class="legend-item"><div class="legend-dot" style="background:#EEEDFE;border:1px solid #534AB7"></div> Backend Express</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FAECE7;border:1px solid #993C1D"></div> Modelos Mongoose</div>
    <div class="legend-item"><div class="legend-dot" style="background:#EAF3DE;border:1px solid #3B6D11"></div> Base de datos</div>
    <div class="legend-item"><div class="legend-dot" style="background:#FAEEDA;border:1px solid #854F0B"></div> Guards / Middleware</div>
  </div>
</body>
</html>
